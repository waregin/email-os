name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emailos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci # postinstall runs `prisma generate`
      - run: npm run build
      - run: npm test
        env:
          # .env.test points DATABASE_URL at this database; the test global
          # setup resets the schema and applies migrations before the run.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emailos_test

  client:
    name: Client (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
