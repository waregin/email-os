# Local Postgres for development and tests.
#   docker compose up -d
# Creates two databases: emailos_dev (app) and emailos_test (test suite).
# Connection string: postgresql://postgres:postgres@localhost:5432/<db>
services:
  postgres:
    image: postgres:16
    container_name: email-os-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emailos_dev
    ports:
      - "5432:5432"
    volumes:
      - email-os-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  email-os-pgdata:
